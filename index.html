            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-border {
            border: 1px solid #00f2ff;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.3), inset 0 0 5px rgba(0, 242, 255, 0.2);
        }
        .neon-glow {
            filter: drop-shadow(0 0 8px #00f2ff);
